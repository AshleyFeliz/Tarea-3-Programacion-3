<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aplicación CRUD para organizar tareas." />
    <title>TaskFlow | Gestor de tareas</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">PROGRAMACIÓN 3 · PROYECTO CRUD</p>
          <h1>Mis tareas</h1>
          <p class="subtitle">Organiza tu trabajo, un paso a la vez.</p>
        </div>
        <span class="brand-mark" aria-hidden="true">TF</span>
      </header>

      <section class="summary" aria-label="Resumen de tareas">
        <article class="summary-card">
          <span class="summary-label">Total</span>
          <strong id="total-count">0</strong>
        </article>
        <article class="summary-card">
          <span class="summary-label">Pendientes</span>
          <strong id="pending-count">0</strong>
        </article>
        <article class="summary-card">
          <span class="summary-label">Completadas</span>
          <strong id="completed-count">0</strong>
        </article>
      </section>

      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

      <section class="workspace">
        <section class="panel form-panel" aria-labelledby="form-heading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">GESTIÓN</p>
              <h2 id="form-heading">Nueva tarea</h2>
            </div>
          </div>
          <form id="task-form">
            <label for="title">Título <span aria-hidden="true">*</span></label>
            <input id="title" name="title" type="text" maxlength="80" required
              placeholder="Ej. Entregar práctica de Git" />

            <label for="description">Descripción</label>
            <textarea id="description" name="description" rows="3" maxlength="300"
              placeholder="Detalles opcionales"></textarea>

            <div class="field-row">
              <div>
                <label for="due-date">Fecha límite</label>
                <input id="due-date" name="dueDate" type="date" />
              </div>
              <div>
                <label for="status">Estado</label>
                <select id="status" name="status">
                  <option value="pending">Pendiente</option>
                  <option value="completed">Completada</option>
                </select>
              </div>
            </div>

            <label for="priority">Prioridad</label>
            <select id="priority" name="priority">
              <option value="low">Baja</option>
              <option value="medium" selected>Media</option>
              <option value="high">Alta</option>
            </select>

            <div class="form-actions">
              <button id="submit-button" class="button button-primary" type="submit">Agregar tarea</button>
              <button id="cancel-edit" class="button button-secondary" type="button" hidden>Cancelar</button>
            </div>
          </form>
        </section>

        <section class="panel list-panel" aria-labelledby="list-heading">
          <div class="section-heading list-heading">
            <div>
              <p class="eyebrow">TU ESPACIO</p>
              <h2 id="list-heading">Lista de tareas</h2>
            </div>
            <div class="list-heading-actions">
              <span id="visible-count" class="visible-count">0 tareas</span>
              <button id="export-tasks" class="button button-secondary" type="button">
                Exportar JSON
              </button>
              <button id="clear-completed" class="button button-secondary" type="button" disabled>
                Limpiar completadas
              </button>
            </div>
          </div>

          <div class="filters">
            <label class="sr-only" for="search">Buscar tareas</label>
            <input id="search" type="search" placeholder="Buscar por título..." />
            <label class="sr-only" for="filter-status">Filtrar por estado</label>
            <select id="filter-status">
              <option value="all">Todos los estados</option>
              <option value="pending">Pendientes</option>
              <option value="completed">Completadas</option>
            </select>
          </div>

          <div id="task-list" class="task-list" aria-live="polite"></div>
          <p id="empty-state" class="empty-state">Todavía no tienes tareas. ¡Agrega la primera!</p>
        </section>
      </section>

      <footer>Los datos se guardan en este navegador.</footer>
    </main>
  </body>
</html>
